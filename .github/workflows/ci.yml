name: CI & Threat Hunting Detection Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-evaluate:
    name: Test & Evaluate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Pytest Test Suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -v --tb=short

      - name: Run Detection & Accuracy Benchmark Gate
        run: |
          python evaluate.py --output-pcap tests/data/ci_benchmark.pcap --json-out scorecard.json

      - name: Upload Benchmark Scorecard
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-scorecard-python-${{ matrix.python-version }}
          path: scorecard.json
          retention-days: 14

          